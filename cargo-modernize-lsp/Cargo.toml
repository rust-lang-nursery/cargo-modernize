[package]
name = "cargo-modernize-lsp"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"

[dependencies]
tower-lsp = "0.19"
tower = "0.4"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"

# Path dependency to the modernization crate in this workspace
cargo-modernize = { path = "../cargo-modernize" }

[dev-dependencies]
