[package]
name = "modernize-ecosystem"
version = "0.1.0"
description = "Generates cargo-modernize's ecosystem data: latest versions, maintenance status, and successor forks"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
flate2 = "1"
jiff = "0.2"
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tar = "0.4"
toml = "0.8"
ureq = { version = "3", features = ["json"] }
