[workspace]
resolver = "2"
members = ["cargo-modernize", "modernize-battery-pack", "modernize-ecosystem", "cargo-modernize-lsp"]
exclude = ["cargo-modernize/tests/fixtures"]

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.85"

[workspace.dependencies]
battery-pack = "0.6"
