[package]
name = "cargo-modernize"
version = "0.1.0"
description = "Ecosystem-aware modernization: crate upgrade plans, std replacements, and edition migrations for your Rust code"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
keywords = ["cargo", "subcommand", "upgrade", "lint", "migration"]
categories = ["development-tools::cargo-plugins"]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
proc-macro2 = { version = "1", features = ["span-locations"] }
quote = "1"
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
syn = { version = "3", features = ["full", "visit", "parsing"] }
toml = "1.2"
walkdir = "2"

[lib]
path = "src/lib.rs"
