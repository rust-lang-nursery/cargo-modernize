# Findings driven by ecosystem data (rules/ecosystem.toml, generated by modernize-ecosystem).
# Each rule's `pattern` is the crate status it reports. Crates with a hand-written
# dependency rule elsewhere are skipped, since that advice is more specific.

[[rule]]
id = "ecosystem/unmaintained"
kind = "ecosystem"
pattern = "unmaintained"
category = "deprecated"
plan = "Unmaintained crates"
message = "This dependency is unmaintained: it won't get bug or security fixes."
docs = "https://rustsec.org/categories/unmaintained.html"

[[rule]]
id = "ecosystem/deprecated"
kind = "ecosystem"
pattern = "deprecated"
category = "deprecated"
plan = "Unmaintained crates"
message = "The maintainer has marked this dependency deprecated."

[[rule]]
id = "ecosystem/archived"
kind = "ecosystem"
pattern = "archived"
category = "deprecated"
plan = "Maintenance risk"
level = "suggest"
message = "This dependency's repository is archived, so it's read-only and won't change. Fine for a finished crate, but plan an exit if you need fixes."

[[rule]]
id = "ecosystem/yanked"
kind = "ecosystem"
pattern = "yanked"
category = "deprecated"
plan = "Unmaintained crates"
level = "deny"
message = "Every published version of this dependency is yanked."

[[rule]]
id = "ecosystem/vulnerable"
kind = "ecosystem"
pattern = "vulnerable"
category = "deprecated"
plan = "Security"
message = "This dependency has a RustSec vulnerability with no patched release. Run `cargo audit` for details."
docs = "https://rustsec.org"

[[rule]]
id = "ecosystem/at-risk"
kind = "ecosystem"
pattern = "at-risk"
category = "deprecated"
plan = "Maintenance risk"
level = "suggest"
message = "This dependency shows signs of abandonment (no releases or commits for years, with unanswered demand). It's not certain; check before investing more in it."

[[rule]]
id = "ecosystem/outdated"
kind = "ecosystem"
pattern = "outdated"
category = "upgrade"
plan = "Newer major versions"
level = "suggest"
message = "A newer semver-incompatible release of this dependency is available."

[[rule]]
id = "ecosystem/transitive"
kind = "ecosystem"
pattern = "transitive"
category = "deprecated"
plan = "Unmaintained transitive dependencies"
level = "suggest"
message = "An indirect dependency is unmaintained, deprecated, or yanked. Upgrading or replacing the crate that pulls it in usually fixes this."
