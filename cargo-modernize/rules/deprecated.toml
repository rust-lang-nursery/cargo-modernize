# Crates whose maintainers have deprecated them, or that are flagged unmaintained in RustSec.
[[rule]]
id = "deprecated/error-chain"
kind = "dependency"
category = "deprecated"
plan = "Unmaintained crates"
crate = "error-chain"
message = "`error-chain` is unmaintained. Use `anyhow` for applications and `thiserror` for libraries (see the error battery pack)."

[[rule]]
id = "deprecated/error-chain-macro"
kind = "macro"
category = "deprecated"
plan = "Unmaintained crates"
crate = "error-chain"
names = ["error_chain"]
message = "`error_chain!` → define errors with `#[derive(thiserror::Error)]`, or use `anyhow::Result` with `anyhow::bail!` / `ensure!` / `.context()`."
[[rule.examples]]
before = """
use error_chain::error_chain;
error_chain! {
    foreign_links {
        Io(std::io::Error);
    }
}"""
after = """
#[derive(Debug, thiserror::Error)]
enum Error {
    #[error(transparent)]
    Io(#[from] std::io::Error),
}"""
source = "rust-cookbook #872, src/errors/handle/retain.md"

[[rule]]
id = "deprecated/failure"
kind = "dependency"
category = "deprecated"
plan = "Unmaintained crates"
crate = "failure"
message = "`failure` is deprecated. Use `anyhow` for applications and `thiserror` for libraries."

[[rule]]
id = "deprecated/structopt"
kind = "dependency"
category = "deprecated"
plan = "Unmaintained crates"
crate = "structopt"
message = "`structopt` is in maintenance mode; its derive was merged into clap 3+. Use `clap = { version = \"4\", features = [\"derive\"] }`."
docs = "https://github.com/clap-rs/clap/blob/master/CHANGELOG.md#migrating"

[[rule]]
id = "deprecated/structopt-derive"
kind = "path"
category = "deprecated"
plan = "Unmaintained crates"
paths = ["structopt::StructOpt"]
message = "`structopt::StructOpt` → `clap::Parser` (`Opt::from_args()` → `Opt::parse()`, `#[structopt(...)]` → `#[arg(...)]` / `#[command(...)]`)."

[[rule]]
id = "deprecated/tempdir"
kind = "dependency"
category = "deprecated"
plan = "Unmaintained crates"
crate = "tempdir"
message = "`tempdir` is deprecated. Use `tempfile::tempdir()` / `tempfile::TempDir`."

[[rule]]
id = "deprecated/tempdir-path"
kind = "path"
category = "deprecated"
plan = "Unmaintained crates"
paths = ["tempdir::TempDir"]
message = "`tempdir::TempDir::new(prefix)` → `tempfile::Builder::new().prefix(prefix).tempdir()` or `tempfile::tempdir()`."

[[rule]]
id = "deprecated/memmap"
kind = "dependency"
category = "deprecated"
plan = "Unmaintained crates"
crate = "memmap"
message = "`memmap` is unmaintained. `memmap2` is the maintained fork with the same API."

