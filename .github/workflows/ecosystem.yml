# Weekly refresh of cargo-modernize's ecosystem data (latest versions, maintenance
# status, successors). Opens a PR so a human reviews new flags before they ship.
name: ecosystem data
on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: target/ecosystem-cache
          key: ecosystem-cache-${{ github.run_id }}
          restore-keys: ecosystem-cache-
      - name: Generate
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MODERNIZE_CONTACT: ${{ vars.MODERNIZE_CONTACT }}
        run: cargo run --release -p modernize-ecosystem -- --top 500
      - name: Check the data still loads
        run: cargo test -p cargo-modernize
      - name: Open PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git diff --quiet -- cargo-modernize/rules/ecosystem.toml && exit 0
          branch="ecosystem/$(date +%F)"
          git switch -c "$branch"
          git -c user.name="github-actions" -c user.email="github-actions@users.noreply.github.com" \
            commit -am "Refresh ecosystem data ($(date +%F))"
          git push -u origin "$branch"
          gh pr create --fill --body "Automated refresh from RustSec, crates.io, and GitHub. Review newly flagged crates and recommended successors before merging."
